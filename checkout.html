<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QualityShop SUT - Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans antialiased text-slate-800">
    <!-- Dynamic Navbar -->
    <header id="navbar" class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm"></header>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-md pointer-events-auto"></div>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <!-- Stepper Indicator -->
        <div class="mb-8 flex items-center justify-between max-w-xl mx-auto px-4">
            <div class="flex items-center gap-2">
                <div id="step-badge-1" class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-md" data-test-id="stepper-badge-1">1</div>
                <span class="text-xs font-semibold text-slate-700 hidden sm:block">Shipping</span>
            </div>
            <div class="h-0.5 bg-slate-200 flex-grow mx-4"></div>
            <div class="flex items-center gap-2">
                <div id="step-badge-2" class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center font-bold text-sm" data-test-id="stepper-badge-2">2</div>
                <span class="text-xs font-semibold text-slate-700 hidden sm:block">Payment</span>
            </div>
            <div class="h-0.5 bg-slate-200 flex-grow mx-4"></div>
            <div class="flex items-center gap-2">
                <div id="step-badge-3" class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center font-bold text-sm" data-test-id="stepper-badge-3">3</div>
                <span class="text-xs font-semibold text-slate-700 hidden sm:block">Review</span>
            </div>
        </div>

        <div id="checkout-step-container"></div>
    </main>

    <!-- Dynamic Footer -->
    <div id="footer"></div>

    <!-- Application Shared Scripts -->
    <script src="js/data.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/state.js"></script>
    <script src="js/api-mock.js"></script>
    <script src="js/components.js"></script>
    <script src="js/automation.js"></script>
    <script src="js/pages/checkout.js"></script>
</body>
</html>
