<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QualityShop SUT - Login Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans antialiased text-slate-800">
    <!-- Dynamic Navbar -->
    <header id="navbar" class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm"></header>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-md pointer-events-auto"></div>

    <!-- Main Content -->
    <main class="max-w-md mx-auto px-4 py-12 flex-grow w-full flex flex-col justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
            <div class="text-center mb-8">
                <div class="inline-flex p-3 rounded-full bg-indigo-50 text-indigo-600 mb-3">
                    <i data-lucide="lock" class="h-8 w-8"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900" data-test-id="login-page-title">Sign In to QualityShop</h1>
                <p class="text-sm text-slate-500 mt-1">Access orders, wishlist & account settings</p>
            </div>

            <!-- Error Banner -->
            <div id="error-message" class="hidden mb-6 p-4 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-sm font-medium" data-test-id="login-error-banner"></div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-700 uppercase mb-1.5">Email Address</label>
                    <div class="relative">
                        <input type="email" id="email" required placeholder="user@test.com" class="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" data-test-id="input-email">
                        <i data-lucide="mail" class="absolute left-3 top-3 h-4 w-4 text-slate-400"></i>
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-700 uppercase mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" id="password" required placeholder="••••••••" class="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" data-test-id="input-password">
                        <i data-lucide="key-round" class="absolute left-3 top-3 h-4 w-4 text-slate-400"></i>
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-2 cursor-pointer text-slate-600">
                        <input type="checkbox" id="remember-me" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 h-4 w-4" data-test-id="remember-me-checkbox">
                        <span>Remember Me (Persistent Auth Cookie)</span>
                    </label>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg text-sm transition shadow-md flex items-center justify-center gap-2" data-test-id="submit-login-btn">
                    <i data-lucide="log-in" class="h-4 w-4"></i> Sign In
                </button>
            </form>

            <!-- Test Credentials Reference Box -->
            <div class="mt-8 pt-6 border-t border-slate-100 bg-amber-50/50 p-4 rounded-xl border border-amber-200/60" data-test-id="test-credentials-box">
                <h3 class="text-xs font-bold text-amber-900 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                    <i data-lucide="info" class="h-4 w-4 text-amber-600"></i> Test Automation Credentials
                </h3>
                <div class="space-y-1.5 text-xs text-amber-800">
                    <div class="flex justify-between items-center bg-white/80 p-2 rounded border border-amber-200/80">
                        <span><strong>Standard User:</strong> <code>user@test.com</code></span>
                        <button type="button" onclick="fillCredentials('user@test.com', 'user123')" class="text-indigo-600 hover:underline font-semibold" data-test-id="fill-user-btn">Fill</button>
                    </div>
                    <div class="flex justify-between items-center bg-white/80 p-2 rounded border border-amber-200/80">
                        <span><strong>Admin User:</strong> <code>admin@test.com</code></span>
                        <button type="button" onclick="fillCredentials('admin@test.com', 'admin123')" class="text-indigo-600 hover:underline font-semibold" data-test-id="fill-admin-btn">Fill</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Dynamic Footer -->
    <div id="footer"></div>

    <!-- Application Shared Scripts -->
    <script src="js/data.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/state.js"></script>
    <script src="js/components.js"></script>
    <script src="js/automation.js"></script>
    <script src="js/pages/login.js"></script>
</body>
</html>
