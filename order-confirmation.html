<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QualityShop SUT - Order Confirmation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans antialiased text-slate-800">
    <!-- Dynamic Navbar -->
    <header id="navbar" class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm"></header>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-md pointer-events-auto"></div>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div id="confirmation-container"></div>
    </main>

    <!-- Dynamic Footer -->
    <div id="footer"></div>

    <!-- Application Shared Scripts -->
    <script src="js/data.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/state.js"></script>
    <script src="js/components.js"></script>
    <script src="js/automation.js"></script>
    <script src="js/pages/order-confirmation.js"></script>
</body>
</html>
