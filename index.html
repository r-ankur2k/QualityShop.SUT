<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QualityShop - Online Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans antialiased text-slate-800">
    <!-- Dynamic Navbar -->
    <header id="navbar" class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm"></header>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-md pointer-events-auto"></div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <!-- Hero Header -->
        <div class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-slate-900 rounded-2xl p-6 sm:p-8 text-white shadow-xl mb-8 flex flex-col md:flex-row items-center justify-between gap-6">
            <div>
                <div class="inline-flex items-center gap-2 bg-indigo-500/30 border border-indigo-400/30 px-3 py-1 rounded-full text-indigo-200 text-xs font-semibold mb-3">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> New Season Sale
                </div>
                <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight">Welcome to QualityShop</h1>
                <p class="mt-2 text-indigo-200 text-sm sm:text-base max-w-xl">
                    Discover premium products across electronics, furniture, apparel, and everyday essentials with fast shipping.
                </p>
            </div>
        </div>

        <!-- Filter & Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Sidebar Filters -->
            <aside class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm h-fit space-y-6">
                <div>
                    <h2 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <i data-lucide="sliders-horizontal" class="h-4 w-4 text-indigo-600"></i> Filters
                    </h2>

                    <!-- Search Field -->
                    <div class="mb-5">
                        <label for="search-input" class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Search Products</label>
                        <div class="relative">
                            <input type="text" id="search-input" placeholder="e.g. Headphones, Chair..." class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" data-test-id="search-input">
                            <i data-lucide="search" class="absolute left-3 top-2.5 h-4 w-4 text-slate-400"></i>
                        </div>
                    </div>

                    <!-- Category Filter -->
                    <div class="mb-5">
                        <label for="category-filter" class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Category</label>
                        <select id="category-filter" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" data-test-id="filter-category-select">
                            <option value="All">All Categories</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Furniture">Furniture</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Apparel">Apparel</option>
                            <option value="Sports">Sports</option>
                            <option value="Home">Home</option>
                            <option value="Health">Health</option>
                            <option value="Office">Office</option>
                        </select>
                    </div>

                    <!-- Price Filter -->
                    <div class="mb-5">
                        <div class="flex justify-between items-center mb-1.5">
                            <label for="price-filter" class="block text-xs font-semibold text-slate-600 uppercase">Max Price</label>
                            <span id="price-value" class="text-xs font-bold text-indigo-600" data-test-id="price-filter-value">$1000</span>
                        </div>
                        <input type="range" id="price-filter" min="10" max="1000" step="10" value="1000" class="w-full accent-indigo-600" data-test-id="filter-price-slider">
                        <div class="flex justify-between text-xs text-slate-400 mt-1">
                            <span>$10</span>
                            <span>$1000</span>
                        </div>
                    </div>

                    <!-- Sorting -->
                    <div class="mb-5">
                        <label for="sort-filter" class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Sort By</label>
                        <select id="sort-filter" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" data-test-id="filter-sort-select">
                            <option value="default">Default Featured</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="rating">Highest Rated</option>
                        </select>
                    </div>

                    <button onclick="resetFilters()" class="w-full py-2 px-3 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-50 transition" data-test-id="reset-filters-btn">
                        Reset All Filters
                    </button>
                </div>
            </aside>

            <!-- Product Grid Main Section -->
            <section class="lg:col-span-3 space-y-4">
                <div class="flex items-center justify-between bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <span id="result-count" class="text-sm font-medium text-slate-600" data-test-id="result-count">Showing 0 products</span>
                </div>

                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </section>
        </div>
    </main>

    <!-- Dynamic Footer -->
    <div id="footer"></div>

    <!-- Application Shared Scripts -->
    <script src="js/data.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/state.js"></script>
    <script src="js/components.js"></script>
    <script src="js/automation.js"></script>
    <script src="js/pages/products.js"></script>
</body>
</html>
